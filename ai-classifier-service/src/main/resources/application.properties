spring.application.name=ai-classifier-service
server.port=8081

spring.config.import=optional:classpath:secrets.properties

spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.temperature=0.0
spring.ai.google.genai.chat.options.model=gemini-3.6-flash

spring.kafka.bootstrap-servers=localhost:9092

# CONFIGURACIÓN DEL CONSUMIDOR
spring.kafka.consumer.group-id=ai-classifier-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.franrl.enums,com.franrl.events

# CONFIGURACIÓN DEL PRODUCTOR
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
