<header class="shadow d-flex align-items-center justify-content-between p-3">
    <div class="d-flex align-items-center gap-3">
        <div class="logo">
            FB
        </div>

        <div>
            <div class="brand-title">
                Feedback Triage
            </div>

            <div class="brand-subtitle">
                Soporte asistido por IA
            </div>
        </div>
    </div>

    <nav mat-tab-nav-bar>

        <a mat-tab-link routerLink="/feedback" routerLinkActive #feedbackActive="routerLinkActive"
            [active]="feedbackActive.isActive">
            Enviar feedback
        </a>

        <a mat-tab-link routerLink="/agent" routerLinkActive #agentActive="routerLinkActive"
            [active]="agentActive.isActive">
            Panel de agente
        </a>

    </nav>

    <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
</header>
