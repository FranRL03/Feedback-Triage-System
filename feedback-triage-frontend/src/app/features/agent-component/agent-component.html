<div class="mt-4 pb-5">
    <div class="mb-5">
        <h2>Bandeja Triage</h2>

        <p class="text-muted">
            {{totalElements}} mensajes · {{needReviews}} requieren revisión humana
        </p>
    </div>

    <div class="card shadow nav-actions flex-row p-3 mb-5 gap-5">

        <div class="d-flex align-items-center">
            <span class="text-muted pe-2">URGENCIA</span>

            <div class="actions">

                <input type="radio" class="btn-check" name="urgency" id="urgency-all" autocomplete="off"
                    [value]="undefined" [(ngModel)]="selectedUrgency" (change)="onFilterChange()">
                <label class="nav-action" for="urgency-all">Todos</label>

                <input type="radio" class="btn-check" name="urgency" id="urgency-low" autocomplete="off"
                    [value]="UrgencyLevel.LOW" [(ngModel)]="selectedUrgency" (change)="onFilterChange()">
                <label class="nav-action" for="urgency-low">LOW</label>

                <input type="radio" class="btn-check" name="urgency" id="urgency-medium" autocomplete="off"
                    [value]="UrgencyLevel.MEDIUM" [(ngModel)]="selectedUrgency" (change)="onFilterChange()">
                <label class="nav-action" for="urgency-medium">MEDIUM</label>

                <input type="radio" class="btn-check" name="urgency" id="urgency-high" autocomplete="off"
                    [value]="UrgencyLevel.HIGH" [(ngModel)]="selectedUrgency" (change)="onFilterChange()">
                <label class="nav-action" for="urgency-high">HIGH</label>

                <input type="radio" class="btn-check" name="urgency" id="urgency-critical" autocomplete="off"
                    [value]="UrgencyLevel.CRITICAL" [(ngModel)]="selectedUrgency" (change)="onFilterChange()">
                <label class="nav-action" for="urgency-critical">CRITICAL</label>

            </div>
        </div>


        <div class="d-flex align-items-center">
            <span class="text-muted pe-2">ESTADO</span>

            <div class="actions">

                <input type="radio" class="btn-check" name="status" id="status-all" autocomplete="off"
                    [value]="undefined" [(ngModel)]="selectedStatus" (change)="onFilterChange()">
                <label class="nav-action" for="status-all">Todos</label>

                <input type="radio" class="btn-check" name="status" id="status-received" autocomplete="off"
                    [value]="FeedbackStatus.RECEIVED" [(ngModel)]="selectedStatus" (change)="onFilterChange()">
                <label class="nav-action" for="status-received">Recibido</label>

                <input type="radio" class="btn-check" name="status" id="status-classified" autocomplete="off"
                    [value]="FeedbackStatus.CLASSIFIED" [(ngModel)]="selectedStatus" (change)="onFilterChange()">
                <label class="nav-action" for="status-classified">Clasificado</label>

            </div>
        </div>

    </div>

    <div>
        @for (ticket of tickets; track ticket.feedbackId) {
        <app-card-component [ticket]="ticket"></app-card-component>
        } @empty {
        <p>El array de tickets está vacío en la vista.</p>
        }
    </div>

    <div class="d-flex justify-content-center pt-3">
        <ngb-pagination [(page)]="pageNumber" [collectionSize]="totalElements" [pageSize]="pageSize"
            [maxSize]="numberOfElements" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadFeedback()"
            aria-label="Default pagination">
        </ngb-pagination>
    </div>
</div>
