spring.application.name=dashboard-service
server.port=8082

spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.url=jdbc:postgresql://localhost:5434/feedback-system
spring.profiles.active=dev
spring.jpa.hibernate.ddl-auto=update

# CONFIGURACIÓN DEL CONSUMIDOR
spring.kafka.consumer.group-id=dashboard-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.franrl.enums,com.franrl.events
